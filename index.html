<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header with language toggle -->
  <header class="app-header">
    <div class="logo-container">
      <h1 id="app-title">🏛️ لعبة الحكم</h1>
    </div>
    <button id="lang-toggle-btn" class="lang-btn" aria-label="Toggle Language">🌐 EN</button>
  </header>

  <main class="app-container">
    <!-- SCREEN 1: HOME -->
    <section id="screen-home" class="screen active">
      <div class="search-container">
        <input type="text" id="search-input" placeholder="ابحث عن دولة..." />
      </div>
      <div class="family-buttons">
        <button id="btn-republics" class="family-btn">
          <span class="family-icon">🏛️</span>
          <span class="family-label" data-key="republics">الجمهوريات</span>
        </button>
        <button id="btn-monarchies" class="family-btn">
          <span class="family-icon">👑</span>
          <span class="family-label" data-key="monarchies">الملكيات</span>
        </button>
      </div>
    </section>

    <!-- SCREEN 2: LIST -->
    <section id="screen-list" class="screen">
      <div class="screen-header">
        <button id="list-back-btn" class="back-btn" aria-label="Back">⬅</button>
        <h2 id="list-title">الجمهوريات</h2>
      </div>
      <!-- Active filters / Search info -->
      <div class="search-info" id="search-info" style="display: none;"></div>
      <!-- Country chips grid -->
      <div id="countries-grid" class="countries-grid"></div>
    </section>

    <!-- SCREEN 3: COUNTRY CARD -->
    <section id="screen-card" class="screen">
      <div class="screen-header">
        <button id="card-back-btn" class="back-btn" aria-label="Back">⬅</button>
        <h2 id="card-title">تفاصيل الدولة</h2>
      </div>

      <div id="country-card-container" class="country-card">
        <!-- Filled dynamically by JavaScript -->
      </div>
    </section>

    <!-- SCREEN 4: GAME SCREEN -->
    <section id="screen-game" class="screen">
      <div class="screen-header">
        <button id="game-back-btn" class="back-btn" aria-label="Back">⬅</button>
        <div id="game-top-bar" class="game-top-bar">
          <!-- Filled dynamically: Flag + Country + Role -->
        </div>
      </div>

      <div class="game-content">
        <!-- Stat bars starting at 50 / profiles -->
        <div class="stats-container">
          <div class="stat-item">
            <div class="stat-label-row">
              <span class="stat-icon-text">💰 <span data-key="economy">اقتصاد</span></span>
              <span id="stat-val-economy" class="stat-val">50%</span>
            </div>
            <div class="stat-bar-bg">
              <div id="stat-bar-economy" class="stat-bar" style="width: 50%;"></div>
            </div>
          </div>

          <div class="stat-item">
            <div class="stat-label-row">
              <span class="stat-icon-text">⚖️ <span data-key="stability">استقرار</span></span>
              <span id="stat-val-stability" class="stat-val">50%</span>
            </div>
            <div class="stat-bar-bg">
              <div id="stat-bar-stability" class="stat-bar" style="width: 50%;"></div>
            </div>
          </div>

          <div class="stat-item">
            <div class="stat-label-row">
              <span class="stat-icon-text">📣 <span data-key="popularity">شعبية</span></span>
              <span id="stat-val-popularity" class="stat-val">50%</span>
            </div>
            <div class="stat-bar-bg">
              <div id="stat-bar-popularity" class="stat-bar" style="width: 50%;"></div>
            </div>
          </div>

          <div class="stat-item">
            <div class="stat-label-row">
              <span class="stat-icon-text">🎖️ <span data-key="military">جيش</span></span>
              <span id="stat-val-military" class="stat-val">50%</span>
            </div>
            <div class="stat-bar-bg">
              <div id="stat-bar-military" class="stat-bar" style="width: 50%;"></div>
            </div>
          </div>

          <div class="stat-item">
            <div class="stat-label-row">
              <span class="stat-icon-text">🛑 <span data-key="corruption">فساد</span></span>
              <span id="stat-val-corruption" class="stat-val">50%</span>
            </div>
            <div class="stat-bar-bg">
              <div id="stat-bar-corruption" class="stat-bar corruption" style="width: 50%;"></div>
            </div>
          </div>
        </div>

        <!-- ديوان القرارات -->
        <div class="decree-panel">
          <h3 class="panel-title" data-key="decreePanelTitle">ديوان القرارات</h3>
          <textarea id="decree-input" class="decree-textarea" placeholder="اكتب مرسومك... مثال: مرسوم بدعم الخبز وخفض الضرائب"></textarea>

          <button id="issue-decree-btn" class="issue-btn">
            <span>🖋️ <span data-key="issueDecreeBtn">أصدر المرسوم</span></span>
          </button>

          <div class="quick-chips-container">
            <button class="quick-chip" data-chip="economic">📊 <span data-key="chipEconomic">اقتصادي</span></button>
            <button class="quick-chip" data-chip="security">🛡️ <span data-key="chipSecurity">أمني</span></button>
            <button class="quick-chip" data-chip="diplomatic">🌐 <span data-key="chipDiplomatic">دبلوماسي</span></button>
            <button class="quick-chip" data-chip="reform">⚖️ <span data-key="chipReform">إصلاح سياسي</span></button>
          </div>
        </div>

        <!-- سجل الأحداث -->
        <div class="log-panel">
          <h3 class="panel-title" data-key="eventLogTitle">📜 سجل الأحداث</h3>
          <div id="event-log-container" class="event-log">
            <!-- Dynamic log entries will go here -->
          </div>
        </div>
      </div>
    </section>

    <!-- SCREEN 5: ENDING SCREEN -->
    <section id="screen-ending" class="screen">
      <div class="ending-card">
        <span class="ending-icon">👑</span>
        <h2 id="ending-title" class="ending-title">قائد تاريخي</h2>
        <p id="ending-desc" class="ending-desc">لقد نجحت في قيادة الدولة نحو الازدهار والاستقرار.</p>

        <div class="ending-stats">
          <div class="ending-stat-row">
            <span data-key="yearLabel">عدد سنوات الحكم:</span>
            <span id="ending-years-val" class="ending-val">10</span>
          </div>
          <div class="ending-stat-row">
            <span data-key="finalStatsLabel" style="font-weight: 700; color: var(--accent-gold);">الإحصائيات النهائية:</span>
          </div>
          <div id="ending-stats-summary" class="ending-stats-summary">
            <!-- Filled dynamically -->
          </div>
        </div>

        <button id="replay-btn" class="replay-btn">
          <span>🔄 <span data-key="replayBtn">إعادة اللعب</span></span>
        </button>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
