<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لعبة الحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header with language toggle -->
  <header class="app-header">
    <div class="logo-container">
      <h1 id="app-title">🏛️ لعبة الحكم</h1>
    </div>
    <button id="lang-toggle-btn" class="lang-btn" aria-label="Toggle Language">🌐 EN</button>
  </header>

  <main class="app-container">
    <!-- SCREEN 1: HOME -->
    <section id="screen-home" class="screen active">
      <div class="search-container">
        <input type="text" id="search-input" placeholder="ابحث عن دولة..." />
      </div>
      <div class="family-buttons">
        <button id="btn-republics" class="family-btn">
          <span class="family-icon">🏛️</span>
          <span class="family-label" data-key="republics">الجمهوريات</span>
        </button>
        <button id="btn-monarchies" class="family-btn">
          <span class="family-icon">👑</span>
          <span class="family-label" data-key="monarchies">الملكيات</span>
        </button>
      </div>
    </section>

    <!-- SCREEN 2: LIST -->
    <section id="screen-list" class="screen">
      <div class="screen-header">
        <button id="list-back-btn" class="back-btn" aria-label="Back">⬅</button>
        <h2 id="list-title">الجمهوريات</h2>
      </div>
      <!-- Active filters / Search info -->
      <div class="search-info" id="search-info" style="display: none;"></div>
      <!-- Country chips grid -->
      <div id="countries-grid" class="countries-grid"></div>
    </section>

    <!-- SCREEN 3: COUNTRY CARD -->
    <section id="screen-card" class="screen">
      <div class="screen-header">
        <button id="card-back-btn" class="back-btn" aria-label="Back">⬅</button>
        <h2 id="card-title">تفاصيل الدولة</h2>
      </div>

      <div id="country-card-container" class="country-card">
        <!-- Filled dynamically by JavaScript -->
      </div>
    </section>

    <!-- SCREEN 4: GAME SCREEN v1 -->
    <section id="screen-game" class="screen">
      <div class="screen-header">
        <button id="game-back-btn" class="back-btn" aria-label="Back">⬅</button>
        <div id="game-top-bar" class="game-top-bar">
          <!-- Filled dynamically: Flag + Country + Role -->
        </div>
      </div>

      <div class="game-content">
        <!-- Stat bars starting at 50 -->
        <div class="stats-container">
          <div class="stat-item">
            <div class="stat-label-row">
              <span class="stat-icon-text">💰 <span data-key="economy">اقتصاد</span></span>
              <span id="stat-val-economy" class="stat-val">50%</span>
            </div>
            <div class="stat-bar-bg">
              <div id="stat-bar-economy" class="stat-bar" style="width: 50%;"></div>
            </div>
          </div>

          <div class="stat-item">
            <div class="stat-label-row">
              <span class="stat-icon-text">⚖️ <span data-key="stability">استقرار</span></span>
              <span id="stat-val-stability" class="stat-val">50%</span>
            </div>
            <div class="stat-bar-bg">
              <div id="stat-bar-stability" class="stat-bar" style="width: 50%;"></div>
            </div>
          </div>

          <div class="stat-item">
            <div class="stat-label-row">
              <span class="stat-icon-text">📣 <span data-key="popularity">شعبية</span></span>
              <span id="stat-val-popularity" class="stat-val">50%</span>
            </div>
            <div class="stat-bar-bg">
              <div id="stat-bar-popularity" class="stat-bar" style="width: 50%;"></div>
            </div>
          </div>

          <div class="stat-item">
            <div class="stat-label-row">
              <span class="stat-icon-text">🎖️ <span data-key="military">جيش</span></span>
              <span id="stat-val-military" class="stat-val">50%</span>
            </div>
            <div class="stat-bar-bg">
              <div id="stat-bar-military" class="stat-bar" style="width: 50%;"></div>
            </div>
          </div>

          <div class="stat-item">
            <div class="stat-label-row">
              <span class="stat-icon-text">😈 <span data-key="corruption">فساد</span></span>
              <span id="stat-val-corruption" class="stat-val">50%</span>
            </div>
            <div class="stat-bar-bg">
              <div id="stat-bar-corruption" class="stat-bar" style="width: 50%;"></div>
            </div>
          </div>
        </div>

        <!-- Game Simulation & Multi-AI Agent Panel -->
        <div class="simulation-panel">
          <div class="advisor-settings">
            <div class="settings-title">
              <span class="advisor-icon">🤖</span>
              <span data-key="advisor_title">مستشارك</span>
            </div>

            <div class="advisor-picker-row">
              <select id="advisor-select" class="advisor-select">
                <option value="local" data-key="opt_local">المستشار المحلي — مجاني</option>
                <option value="gemini">Gemini</option>
                <option value="claude">Claude</option>
                <option value="openai">OpenAI</option>
                <option value="deepseek">DeepSeek</option>
                <option value="openrouter">OpenRouter</option>
              </select>
            </div>

            <!-- API Key Input container -->
            <div id="api-key-container" class="api-key-container" style="display: none;">
              <input type="password" id="api-key-input" class="api-key-input" placeholder="أدخل مفتاح الـ API..." />
              <div class="api-key-note" data-key="api_key_note">مفتاحك يبقى في متصفحك فقط</div>
            </div>

            <!-- OpenRouter Models dropdown -->
            <div id="openrouter-model-container" class="openrouter-model-container" style="display: none;">
              <select id="openrouter-model-select" class="model-select">
                <option value="x-ai/grok-3-mini">x-ai/grok-3-mini</option>
                <option value="qwen/qwen-2.5-72b-instruct">qwen/qwen-2.5-72b-instruct</option>
                <option value="moonshotai/kimi-k2">moonshotai/kimi-k2</option>
                <option value="meta-llama/llama-3.3-70b-instruct">meta-llama/llama-3.3-70b-instruct</option>
                <option value="mistralai/mistral-large">mistralai/mistral-large</option>
              </select>
            </div>
          </div>

          <!-- Decree input and submission -->
          <div class="decree-input-container">
            <textarea id="decree-textarea" class="decree-textarea" placeholder="اكتب مرسومك هنا لتغيير سياسة الدولة..."></textarea>
            <button id="decree-submit-btn" class="decree-submit-btn">
              <span id="btn-submit-text" data-key="submit_decree">إصدار المرسوم 📜</span>
            </button>
          </div>

          <!-- Narrative Results Panel -->
          <div id="narrative-result-panel" class="narrative-result-panel" style="display: none;">
            <div class="narrative-header">
              <span class="result-badge" id="advisor-badge">المستشار المحلي</span>
            </div>
            <p id="narrative-text" class="narrative-text"></p>
            <div id="effects-badge-row" class="effects-badge-row"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="adapters.js"></script>
  <script src="game.js"></script>
</body>
</html>
